name: Auto Renew The Rose Cloud

on:
  workflow_dispatch:

concurrency:
  group: renew-therose
  cancel-in-progress: false

jobs:
  renew-therose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            fonts-noto-cjk \
            jq \
            wget

          python -m pip install --upgrade pip
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🌐 Setup Proxy (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 Run renewal script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 renew_therose.py

      - name: 🧹 Cleanup processes
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true

          rm -f \
            sing-box \
            sing-box-config.json \
            sing-box.log

      - name: 🗑️ Delete old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list \
            --workflow "main.yml" \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId')

          COUNT=0

          for RUN_ID in $RUNS; do
            COUNT=$((COUNT + 1))

            if [ "$COUNT" -gt 1 ]; then
              echo "Deleting run: $RUN_ID"
              gh run delete "$RUN_ID" || true
            fi
          done
